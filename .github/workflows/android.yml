name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: '发布到 Releases 的标签名（如 v2.0），留空则只构建不发布'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Alpha APK (unsigned)
        run: ./gradlew assembleAlpha

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Alpha APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: alpha-apk-unsigned
          path: app/build/outputs/apk/alpha/*.apk

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    # 仅在推送 v* 标签、或手动触发且填写了 tag 时发布
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    permissions:
      contents: write

    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk-release

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk-debug

      - name: Download Alpha APK
        uses: actions/download-artifact@v4
        with:
          name: alpha-apk-unsigned
          path: apk-alpha

      - name: Rename APKs
        run: |
          mkdir -p out
          cp apk-release/*.apk out/ArkAuthLegacy-${{ steps.tag.outputs.name }}-release.apk
          cp apk-debug/*.apk   out/ArkAuthLegacy-${{ steps.tag.outputs.name }}-debug.apk
          cp apk-alpha/*.apk   out/ArkAuthLegacy-${{ steps.tag.outputs.name }}-alpha-unsigned.apk

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-beta') }}
          files: out/*.apk